<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>SPE Тренажер продажів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky progress bar on top, stage "staircase" rail on the left, working area on the right; rail becomes a horizontal strip on phones. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #131B26;
  --muted: #5A6574;
  --line: #D8DEE6;
  --accent: #1F4FD1;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E9FB;
  --gold: #B07A00;
  --gold-strong: #E0A400;
  --gold-soft: #FBF0D2;
  --rec: #D23A2A;
  --rec-soft: #FBE4E1;
  --ok: #1D8653;
  --ok-soft: #DCF1E5;
  --fill-bg: #FFEFB8;
  --fill-ink: #573D00;
  --shadow: 0 1px 2px rgba(19, 27, 38, .06), 0 4px 16px rgba(19, 27, 38, .06);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1319; --surface: #161D26; --surface-2: #1C2531; --ink: #E6EBF2; --muted: #95A1B0; --line: #2A3543;
    --accent: #7E9CFF; --accent-ink: #0A1022; --accent-soft: #1C2A4E;
    --gold: #F2B632; --gold-strong: #F2B632; --gold-soft: #3A2E10;
    --rec: #FF6D5C; --rec-soft: #3D1C18; --ok: #4CC88A; --ok-soft: #153526;
    --fill-bg: #47380E; --fill-ink: #FFE6A0; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1319; --surface: #161D26; --surface-2: #1C2531; --ink: #E6EBF2; --muted: #95A1B0; --line: #2A3543;
  --accent: #7E9CFF; --accent-ink: #0A1022; --accent-soft: #1C2A4E;
  --gold: #F2B632; --gold-strong: #F2B632; --gold-soft: #3A2E10;
  --rec: #FF6D5C; --rec-soft: #3D1C18; --ok: #4CC88A; --ok-soft: #153526;
  --fill-bg: #47380E; --fill-ink: #FFE6A0; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .01em; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 12px; }
.stats { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.stat .num { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.lvl { display: grid; gap: 4px; min-width: 170px; }
.lvl-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.lvl-name { font-weight: 600; }
.lvl-xp { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-strong), var(--gold)); border-radius: 99px; transition: width .5s ease; }
.ring { width: 34px; height: 34px; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.flame { width: 22px; height: 22px; }
.flame path { fill: var(--rec); }
.flame.off path { fill: var(--line); }

/* ---------- shell ---------- */
.shell { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 4px; }
.rail-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
.nav { display: grid; grid-template-columns: 30px minmax(0,1fr); align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.nav:hover { background: var(--surface); }
.nav[aria-current="page"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.nav .dot { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.nav[aria-current="page"] .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nav.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.nav .t { font-weight: 600; font-size: 14px; line-height: 1.2; }
.nav .s { font-size: 12px; color: var(--muted); display: block; }
.nav .mini { height: 3px; border-radius: 3px; background: var(--line); margin-top: 5px; overflow: hidden; }
.nav .mini i { display: block; height: 100%; background: var(--ok); }
.nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

main { min-width: 0; display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); min-width: 0; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.2vw, 30px); line-height: 1.15; letter-spacing: -.01em; }
.h2 { font-family: var(--f-display); font-weight: 500; font-size: 18px; line-height: 1.25; }
.lead { color: var(--muted); max-width: 64ch; margin: 8px 0 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }

/* ---------- home: staircase ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: end; }
.stairs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; align-items: end; height: 190px; }
.step { position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; background: none; border: 0; padding: 0; text-align: left; }
.step .col { position: relative; border-radius: 8px 8px 3px 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.step .col i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ok); opacity: .85; transition: height .6s ease; }
.step .col span { position: absolute; top: 6px; left: 8px; font-family: var(--f-mono); font-weight: 700; font-size: 13px; z-index: 1; }
.step em { font-style: normal; font-size: 11.5px; line-height: 1.2; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; hyphens: auto; }
.step:hover .col { border-color: var(--accent); }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin-top: 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; }
.field small { color: var(--muted); font-size: 12px; }
.field input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.field input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); font-size: 13.5px; }
.note.info { background: var(--accent-soft); }
.note b { font-weight: 600; }

.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 14px; }
.rule { padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.rule .pts { font-family: var(--f-mono); font-weight: 700; color: var(--gold); }
.rule p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

/* ---------- stage ---------- */
.stage-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.checklist { display: grid; gap: 6px; min-width: 220px; font-size: 13px; }
.check { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 8px; align-items: center; }
.check .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); display: grid; place-items: center; }
.check.ok .box { background: var(--ok); border-color: var(--ok); }
.check.ok .box::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.check .n { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 18px; overflow-x: auto; }
.tab { padding: 10px 14px; border: 0; background: none; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .c { font-family: var(--f-mono); font-size: 12px; margin-left: 6px; color: var(--muted); }

.cards { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.card h3 { font-size: 17px; font-weight: 700; margin-top: 2px; }
.what { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.badge-ok { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ok); background: var(--ok-soft); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.phrase { font-size: 17px; line-height: 1.6; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.phrase mark { background: var(--fill-bg); color: var(--fill-ink); border-radius: 4px; padding: 0 3px; }
.phrase mark.empty { opacity: .7; font-style: italic; }
.phrase .cue { color: var(--muted); font-style: italic; font-size: .9em; }
.phrase-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ai-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; margin-right: 6px; }
.tip { font-size: 13px; color: var(--muted); border-left: 2px solid var(--gold-strong); padding-left: 10px; }

/* recorder */
.recbox { display: grid; gap: 10px; padding-top: 12px; border-top: 1px dashed var(--line); }
.recbtn { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; border-radius: 99px; border: 1px solid var(--rec); background: var(--surface); color: var(--rec); font-weight: 700; font-size: 14px; }
.recbtn .led { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); }
.recbtn.on { background: var(--rec); color: var(--surface); }
.recbtn.on .led { background: var(--surface); border-radius: 3px; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.meter { display: inline-flex; gap: 3px; align-items: center; height: 22px; }
.meter i { width: 4px; height: 4px; border-radius: 2px; background: var(--rec); transition: height .08s; }
.timer { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.takes { display: grid; gap: 8px; }
.take { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.take audio { width: 100%; height: 36px; min-width: 0; }
.take .when { font-size: 12px; color: var(--muted); font-family: var(--f-mono); white-space: nowrap; }
.take .heard { font-size: 11px; color: var(--ok); font-weight: 600; }
.selfcheck { display: grid; gap: 4px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.selfcheck legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
.selfcheck label { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
.selfcheck input { margin-top: 3px; accent-color: var(--ok); }
.hint { font-size: 12.5px; color: var(--muted); }
.upload { position: relative; overflow: hidden; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* scenarios */
.client { display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 10px; align-items: start; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-family: var(--f-display); font-size: 13px; }
.bubble { background: var(--accent-soft); border-radius: 4px 14px 14px 14px; padding: 10px 14px; font-size: 16px; }
.bubble small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.model { border-left: 3px solid var(--ok); }
.rate { display: flex; gap: 8px; flex-wrap: wrap; }
.rate .btn[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

/* quiz */
.q { display: grid; gap: 8px; }
.q + .q { padding-top: 16px; border-top: 1px solid var(--line); }
.q h4 { margin: 0; font-size: 15.5px; font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 14.5px; }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--rec); background: var(--rec-soft); }
.why { font-size: 13px; color: var(--muted); }
.score { font-family: var(--f-display); font-size: 22px; }

/* awards */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.bdg { display: grid; gap: 6px; justify-items: start; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
.bdg svg { width: 44px; height: 44px; }
.bdg .medal { fill: var(--line); }
.bdg .medal-in { fill: var(--surface); }
.bdg.got { background: var(--gold-soft); border-color: color-mix(in srgb, var(--gold) 40%, var(--line)); }
.bdg.got .medal { fill: var(--gold-strong); }
.bdg b { font-size: 14px; }
.bdg span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.levels { display: grid; gap: 6px; margin-top: 10px; }
.level { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 10px; font-size: 13.5px; padding: 6px 10px; border-radius: 8px; }
.level.cur { background: var(--gold-soft); font-weight: 600; }
.level .x { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; margin-top: 12px; }
.day { display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--muted); }
.day i { width: 100%; height: 56px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.day i b { position: absolute; bottom: 0; left: 0; right: 0; background: var(--ok); }
.day .v { font-family: var(--f-mono); color: var(--ink); }

/* records & team */
.lib-group { display: grid; gap: 8px; }
.lib-group + .lib-group { margin-top: 18px; }
.lib-group h3 { font-size: 14px; }
.board { width: 100%; border-collapse: collapse; font-size: 14px; }
.board th, .board td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
.board th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.board td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.board tr.me td { background: var(--gold-soft); }
.tablewrap { overflow-x: auto; }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.links a { display: block; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); text-decoration: none; color: var(--ink); font-size: 13.5px; }
.links a:hover { border-color: var(--accent); }
.empty-state { text-align: center; padding: 30px 10px; color: var(--muted); }

/* toasts */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 50; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: tin .25s ease; }
.toast .p { font-family: var(--f-mono); font-weight: 700; color: var(--gold-strong); }
.toast.big { background: var(--gold-strong); color: #1E1500; }
.toast.big .p { color: #1E1500; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; width: 100%; height: 100%; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .rail-label { display: none; }
  .nav { width: auto; flex: none; grid-template-columns: 26px auto; padding: 6px 10px 6px 6px; background: var(--surface); border-color: var(--line); }
  .nav .dot { width: 26px; height: 26px; }
  .nav .s, .nav .mini { display: none; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .stage-head { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .form { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 16px; }
  .card { padding: 14px; }
  .lvl { min-width: 140px; }
  .phrase { font-size: 16px; }
  .take { grid-template-columns: minmax(0, 1fr) auto; }
  .take .when { grid-column: 1 / -1; }
  .stairs { height: 150px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="9" fill="var(--accent)"/>
        <path d="M7 26h5v-5h5v-5h5v-5h5" stroke="var(--accent-ink)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

/* Fill a template with the business profile. html=true → marks + cues. */
function fill(tpl, html) {
  const P = S.profile;
  const parts = String(tpl).split(/(\{[A-Za-z]+\})/g);
  return parts.map(p => {
    const m = p.match(/^\{([A-Za-z]+)\}$/);
    if (m) {
      const raw = m[1]; const key = raw.charAt(0).toLowerCase() + raw.slice(1);
      const field = FIELDS.find(f => f.k === key);
      let val = (P[key] || "").trim();
      if (raw[0] !== raw[0].toLowerCase()) val = cap(val);
      if (!html) return val || "[" + (field ? field.label.toLowerCase() : key) + "]";
      if (!val) return '<mark class="empty">[' + esc(field ? field.label.toLowerCase() : key) + "]</mark>";
      return "<mark>" + esc(val) + "</mark>";
    }
    return html ? esc(p).replace(/\(([^)]*)\)/g, '<span class="cue">($1)</span>') : p;
  }).join("");
}
const cueOnly = s => esc(s).replace(/\(([^)]*)\)/g, '<span class="cue">($1)</span>');

/* ===================================================================== PROGRESS / XP */
function levelOf(xp) {
  let i = 0; while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
  const next = LEVELS[i + 1];
  return { i, name: LEVELS[i][1], base: LEVELS[i][0], next: next ? next[0] : null };
}
function streak() {
  let n = 0; const d = new Date();
  if (!(S.log[dayKey(d)] > 0)) d.setDate(d.getDate() - 1);
  while (S.log[dayKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function stageStatus(st) {
  const techDone = st.techniques.filter(t => S.tech[t.id]).length;
  const scenDone = st.scenarios.filter(c => S.scen[c.id]).length;
  const quizBest = S.quiz[st.id] || 0;
  const quizOk = quizBest >= st.quiz.length - 1;
  const parts = st.techniques.length + st.scenarios.length + st.quiz.length;
  const pct = (techDone + scenDone + Math.min(quizBest, st.quiz.length)) / parts;
  return { techDone, scenDone, quizBest, quizOk, pct, complete: techDone === st.techniques.length && scenDone === st.scenarios.length && quizOk };
}

function award(xp, why) {
  const before = levelOf(S.xp).i;
  S.xp += xp;
  const k = dayKey(); const was = S.log[k] || 0; S.log[k] = was + xp;
  toast(why, "+" + xp + " XP");
  const after = levelOf(S.xp);
  if (after.i > before) { toast("Новий рівень: " + after.name, "Рів. " + (after.i + 1), true); burst(); }
  if (was < DAILY_GOAL && S.log[k] >= DAILY_GOAL) toast("Денну ціль виконано", DAILY_GOAL + " XP", true);
  checkBadges();
  save(); renderTop(); renderRail();
}
function checkBadges() {
  let got = false;
  for (const b of BADGES) {
    if (!S.badges[b.id] && b.ok()) { S.badges[b.id] = Date.now(); toast("Бейдж: " + b.t, "★", true); got = true; }
  }
  if (got) burst();
}

/* ----- quiz ----- */
const quizRun = {}; // stageId -> {order:[[idx...]], answers:{}, checked:bool}
function shuffled(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function quizPanel(st) {
  const run = quizRun[st.id] || (quizRun[st.id] = { order: st.quiz.map(q => shuffled(q.a.length)), answers: {}, checked: false });

/* ===================================================================== RECORDING */
let micBlocked = false;
let active = null; // {key, kind, mr, chunks, stream, t0, tick, ctx, raf}
const revealed = new Set();
const urls = new Map();

async function startRec(key, kind) {
  if (active) { const same = active.key === key; await stopActiveRec(); if (same) return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") return blockMic();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return blockMic(e && e.name === "NotAllowedError"); }
  const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  const mime = types.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
  let mr;
  try { mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); } catch (e) { stream.getTracks().forEach(t => t.stop()); return blockMic(); }
  const a = { key, kind, mr, chunks: [], stream, t0: performance.now(), mime: mr.mimeType || mime || "audio/webm" };
  active = a;
  mr.ondataavailable = e => { if (e.data && e.data.size) a.chunks.push(e.data); };
  a.done = new Promise(res => { mr.onstop = res; });
  mr.start(250);
  const btn = document.querySelector('[data-rec="' + key + '"]');
  if (btn) {
    btn.classList.add("on");
    btn.querySelector(".lbl").innerHTML = 'Стоп <span class="timer">0:00</span>';
    btn.insertAdjacentHTML("afterend", '<span class="meter" id="meter" aria-hidden="true">' + "<i></i>".repeat(8) + "</span>");
  }
  a.tick = setInterval(() => { const t = btn && btn.querySelector(".timer"); if (t) t.textContent = fmtSec((performance.now() - a.t0) / 1000); }, 250);
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    a.ctx = new AC(); const src = a.ctx.createMediaStreamSource(stream); const an = a.ctx.createAnalyser(); an.fftSize = 64; src.connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    const loop = () => { an.getByteFrequencyData(buf); const bars = document.querySelectorAll("#meter i"); bars.forEach((b, i) => { const v = buf[2 + i * 2] / 255; b.style.height = (4 + v * 18) + "px"; }); a.raf = requestAnimationFrame(loop); };
    loop();
  } catch (e) {}
}
async function stopActiveRec() {
  const a = active; if (!a) return;
  active = null;
  clearInterval(a.tick); cancelAnimationFrame(a.raf);
  try { a.ctx && a.ctx.close(); } catch (e) {}
  if (a.mr.state !== "inactive") a.mr.stop();
  await a.done;
  a.stream.getTracks().forEach(t => t.stop());
  const dur = (performance.now() - a.t0) / 1000;
  const blob = new Blob(a.chunks, { type: a.mime });
  const btn = document.querySelector('[data-rec="' + a.key + '"]');
  if (btn) { btn.classList.remove("on"); btn.querySelector(".lbl").textContent = "Записати ще"; }
  const m = $("#meter"); if (m) m.remove();
  await storeTake(a.key, a.kind, blob, dur);
}
function blockMic(denied) {
  micBlocked = true;
  toast(denied ? "Доступ до мікрофона заборонено. Можна додати запис з диктофона." : "Мікрофон недоступний у цьому вікні. Додайте запис з диктофона.", "", false);
  document.querySelectorAll("[data-rec]").forEach(b => { b.outerHTML = recControl(b.dataset.rec, b.dataset.kind); });
}
async function storeTake(key, kind, blob, dur) {
  if (dur < 1 || blob.size < 500) { toast("Запис надто короткий. Спробуйте ще раз.", "", false); return; }
  const take = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), key, kind, ts: Date.now(), dur, blob, listened: false, checks: [] };
  await putTake(take);
  S.recCount++;
  if (dur >= MIN_SEC) {
    const k = dayKey();
    if (kind === "tech") {
      const first = !S.tech[key];
      S.tech[key] = (S.tech[key] || 0) + 1;
      if (S.recAward[key] !== k) { S.recAward[key] = k; award(15, first ? "Перший запис техніки" : "Щоденна практика техніки"); }
      else { checkBadges(); save(); renderTop(); renderRail(); }
      const card = document.getElementById("card-" + key);
      if (card && first) { card.classList.add("done"); const top = card.querySelector(".card-top"); if (top && !top.querySelector(".badge-ok")) top.insertAdjacentHTML("beforeend", '<span class="badge-ok">Відпрацьовано</span>'); }
    } else {
      S.scenRec = S.scenRec || {}; S.scenRec[key] = true;
      checkBadges(); save(); renderTop();
      toast("Відповідь записано. Тепер звірте з еталоном.", "", false);
    }
  } else {
    checkBadges(); save(); renderTop();
    toast("Записано. XP нараховуються за записи від " + MIN_SEC + " секунд.", "", false);
  }
  renderTakes(key);
}

/* ----- storage of takes: IndexedDB, memory fallback ----- */
let idbP = null; const memTakes = new Map();
function idb() {
  if (idbP) return idbP;
  idbP = new Promise(res => {
    try {
      const r = indexedDB.open("spe-trainer", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("takes", { keyPath: "id" });
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
  return idbP;
}
async function putTake(t) {
  const d = await idb();
  if (!d) { memTakes.set(t.id, t); return; }
  await new Promise(res => { try { const tx = d.transaction("takes", "readwrite"); tx.objectStore("takes").put(t); tx.oncomplete = res; tx.onerror = () => { memTakes.set(t.id, t); res(); }; } catch (e) { memTakes.set(t.id, t); res(); } });
}
async function allTakes() {
  const d = await idb(); let arr = [...memTakes.values()];
  if (d) arr = arr.concat(await new Promise(res => { try { const q = d.transaction("takes").objectStore("takes").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } }));
  return arr.sort((a, b) => b.ts - a.ts);
}
async function delTake(id) {
  memTakes.delete(id);
  const d = await idb(); if (d) await new Promise(res => { try { const tx = d.transaction("takes", "readwrite"); tx.objectStore("takes").delete(id); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } });
  if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
}
function urlFor(t) { if (!urls.has(t.id)) urls.set(t.id, URL.createObjectURL(t.blob)); return urls.get(t.id); }
function takeRow(t, withDelete) {
  const d = new Date(t.ts);
  return '<div class="take"><span class="when">' + d.toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" }) + " · " + fmtSec(t.dur) + "</span>" +
    '<audio controls preload="metadata" src="' + urlFor(t) + '" data-take="' + t.id + '"></audio>' +
    (withDelete ? '<button class="btn ghost small" data-del="' + t.id + '" aria-label="Видалити запис">' + ICON.trash + "</button>" : (t.listened ? '<span class="heard">Прослухано</span>' : '<span class="heard" style="color:var(--muted)">Прослухайте</span>')) + "</div>";
}
async function renderTakes(key) {
  const box = document.getElementById("takes-" + key); if (!box) return;
  const list = (await allTakes()).filter(t => t.key === key).slice(0, 3);
  if (!list.length) { box.innerHTML = ""; return; }
  let h = list.map(t => takeRow(t, false)).join("");
  const last = list[0];
  if (last.kind === "tech" && last.dur >= MIN_SEC) {
    h += '<fieldset class="selfcheck"><legend>Самоперевірка останнього запису (+3 XP за кожен пункт)</legend>' +
      SELF_CHECK.map((c, i) => '<label><input type="checkbox" data-check="' + last.id + '" data-i="' + i + '"' + (last.checks[i] ? " checked disabled" : "") + "> " + esc(c) + "</label>").join("") + "</fieldset>";
  }

}

/* ===================================================================== TOASTS + FX */
function toast(text, pts, big) {
  const el = document.createElement("div");
  el.className = "toast" + (big ? " big" : "");
  el.innerHTML = (pts ? '<span class="p">' + esc(pts) + "</span>" : "") + "<span>" + esc(text) + "</span>";
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), big ? 4200 : 2800);
}
function burst() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#fx"); c.hidden = false; const ctx = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--gold-strong", "--accent", "--ok", "--rec"].map(v => cs.getPropertyValue(v).trim() || "#E0A400");
  const ps = [...Array(90)].map(() => ({ x: W / 2, y: H * 0.35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 10 - 3, r: Math.random() * 4 + 3, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  let f = 0;
  (function step() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
    if (++f < 80) requestAnimationFrame(step); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })();
}

  typing = setTimeout(() => {
    const filled = FIELDS.filter(x => (S.profile[x.k] || "").trim()).length;
    if (filled >= 6 && !S.profileXp) { S.profileXp = true; award(20, "Профіль бізнесу заповнено"); }
    else { checkBadges(); save(); renderTop(); }
  }, 700);
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.q !== undefined && t.dataset.stage) { quizRun[t.dataset.stage].answers[+t.dataset.q] = +t.dataset.a; return; }
  if (t.dataset.check) {
    const take = await getTake(t.dataset.check); if (!take) return;
    const i = +t.dataset.i;
    if (t.checked && !take.checks[i]) {
      take.checks[i] = true; await putTake(take); t.disabled = true;
      S.checkCount++; award(3, "Самоперевірка");
    }
    return;
  }
  if (t.dataset.upload) {
    const file = t.files && t.files[0]; if (!file) return;
    const dur = await audioDuration(file);
    await storeTake(t.dataset.upload, t.dataset.kind, file, dur);
    t.value = "";
  }
});
function audioDuration(blob) {
  return new Promise(res => {
    const guess = blob.size / 16000; let doneFlag = false;
    const finish = d => { if (doneFlag) return; doneFlag = true; URL.revokeObjectURL(u); res(d); };
    const a = new Audio(); const u = URL.createObjectURL(blob);
    a.preload = "metadata";
    a.onloadedmetadata = () => finish(isFinite(a.duration) && a.duration > 0 ? a.duration : guess);
    a.onerror = () => finish(guess);
    setTimeout(() => finish(guess), 4000);
    a.src = u;
  });
}
document.addEventListener("ended", async e => {
  const id = e.target.dataset && e.target.dataset.take; if (!id) return;
  const take = await getTake(id); if (!take || take.listened) return;
  take.listened = true; await putTake(take);
  S.listenCount++; award(5, "Прослухали себе");
  const h = e.target.parentElement.querySelector(".heard"); if (h) { h.textContent = "Прослухано"; h.style.color = ""; }
}, true);
document.addEventListener("click", async e => {
  const el = e.target.closest("button, [data-go]"); if (!el) return;
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.tab) { S.ui.tab[d.stage] = d.tab; persist(); stopActiveRec(); return renderStage(STAGES.find(s => s.id === d.stage)); }
  if (d.rec) return startRec(d.rec, d.kind);
  if (d.next) { S.vi[d.next] = ((S.vi[d.next] || 0) + 1) % variantsOf(techById(d.next)).length; persist(); return replaceCard(d.next); }
  if (d.copy) {
    const t = techById(d.copy); const vs = variantsOf(t); const cur = vs[(S.vi[t.id] || 0) % vs.length];
    const text = cur.ai ? cur.text : fill(cur.tpl, false);
    try { await navigator.clipboard.writeText(text); toast("Фразу скопійовано", "", false); }
    catch (err) { const r = document.createRange(); r.selectNodeContents($("#ph-" + t.id)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Фразу виділено. Натисніть Ctrl+C", "", false); }
    return;
  }
  if (d.ai) return aiVariants(d.ai, el);
  if (d.reveal) { revealed.add(d.reveal); el.hidden = true; const m = document.getElementById("model-" + d.reveal); if (m) m.hidden = false; return; }
  if (d.rate) {
    const id = d.rate, v = +d.v;
    if (!(S.scenRec && S.scenRec[id])) { toast("Спершу запишіть свою відповідь від " + MIN_SEC + " секунд", "", false); return; }
    const first = !S.scen[id];
    const k = dayKey();
    const prevDay = S.scen[id] && S.scen[id].day;
    S.scen[id] = { rating: v, day: k };
    el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === el)));
    if (first) award(20, "Ситуацію відпрацьовано");
    else if (prevDay !== k) award(5, "Повторна практика ситуації");
    else { save(); }
    const card = document.getElementById("card-" + id);
    if (card && first) card.classList.add("done");
    const st = STAGES.find(s => s.id === S.ui.view); if (st && first) { const scroll = scrollY; renderStage(st); scrollTo(0, scroll); }
    return;
  }
  if (d.quizcheck) return checkQuiz(STAGES.find(s => s.id === d.quizcheck));
  if (d.quizreset) { delete quizRun[d.quizreset]; return renderStage(STAGES.find(s => s.id === d.quizreset)); }
  if (d.del) { await delTake(d.del); return renderRecords(); }
  if (el.id === "clearEx") {
    if (S.isExample) { FIELDS.forEach(f => S.profile[f.k] = ""); S.isExample = false; }
    else { S.profile = { ...EXAMPLE }; S.isExample = true; }
    save(); renderTop(); renderHome();
    const first = $("#f-company"); if (first && !S.isExample) first.focus();
  }
});
addEventListener("pagehide", () => { if (active) stopActiveRec(); });

/* ===================================================================== BOOT */
renderTop(); renderRail(); renderMain();
initCloud();
</script>
