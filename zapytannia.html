<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Робота із запитаннями</title>
<meta name="description" content="Заняття 4 курсу «Публічні виступи»: інтерактивний зошит із блоками, які відкриває ведучий, завданнями з прикладами та балами.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f0;
    --surface: #ffffff;
    --surface-2: #f7f7f5;
    --text: #1d1f1e;
    --muted: #5f6662;
    --line: #e2e4e1;
    --accent: #2bb98a;
    --accent-strong: #138a63;
    --accent-soft: #e3f6ee;
    --on-accent: #ffffff;
    --quote-bg: #eee8fb;
    --quote-text: #3b3355;
    --gold: #e0a43a;
    --gold-soft: #fbf1dc;
    --bad: #d6504a;
    --bad-soft: #fbe6e5;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121514; --surface: #1b1f1d; --surface-2: #222724; --text: #ebefed; --muted: #a2aba6;
      --line: #2f3532; --accent: #36c896; --accent-strong: #5fdcb0; --accent-soft: #183a2e; --on-accent: #0c1a14;
      --quote-bg: #2a2540; --quote-text: #ddd5f7; --gold: #f0b955; --gold-soft: #3a2f18; --bad: #ef7b75; --bad-soft: #3d2120;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121514; --surface: #1b1f1d; --surface-2: #222724; --text: #ebefed; --muted: #a2aba6;
    --line: #2f3532; --accent: #36c896; --accent-strong: #5fdcb0; --accent-soft: #183a2e; --on-accent: #0c1a14;
    --quote-bg: #2a2540; --quote-text: #ddd5f7; --gold: #f0b955; --gold-soft: #3a2f18; --bad: #ef7b75; --bad-soft: #3d2120;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 16px/1.55 "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1, h2, h3 { font-family: "Unbounded", "Montserrat", sans-serif; line-height: 1.25; margin: 0; }
  h2 { font-size: 1.2rem; font-weight: 600; }
  h3 { font-size: .95rem; font-weight: 600; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  button { font-family: inherit; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- Score bar ---------- */
  .scorebar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .scorebar-in {
    max-width: 920px; margin: 0 auto; padding: 10px 16px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  }
  .score { font: 700 1.25rem/1 "Unbounded", sans-serif; white-space: nowrap; }
  .score small { font: 500 .72rem "Montserrat", sans-serif; color: var(--muted); margin-left: 4px; }
  .level { font-size: .8rem; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .level span:last-child { color: var(--muted); font-weight: 500; }
  .lvbar { height: 7px; border-radius: 4px; background: var(--line); margin-top: 5px; overflow: hidden; }
  .lvbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .4s; }
  .badges { display: flex; gap: 3px; }
  .badges span {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem;
    background: var(--surface-2); border: 1.5px solid var(--line); filter: grayscale(1); opacity: .45; transition: .3s;
  }
  .badges span.on { filter: none; opacity: 1; border-color: var(--gold); background: var(--gold-soft); }
  .badges span.pop { animation: pop .6s ease; }
  @keyframes pop { 40% { transform: scale(1.5); } }

  /* ---------- Header ---------- */
  .hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; margin: 24px 0 20px; }
  .badge { background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 8px 12px 6px; text-align: center; line-height: 1; }
  .badge b { display: block; font: 700 2rem/1 "Unbounded", sans-serif; }
  .badge span { font-size: .62rem; letter-spacing: .04em; }
  .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
  .hero h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; }

  .theme-toggle {
    position: fixed; right: 16px; bottom: 16px; z-index: 30;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    box-shadow: var(--shadow); cursor: pointer; font-size: 1.1rem;
  }

  /* ---------- Blocks ---------- */
  .card { background: var(--surface); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .block { scroll-margin-top: 80px; animation: reveal .5s ease; }
  @keyframes reveal { from { opacity: 0; transform: translateY(12px); } }
  .block-head { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .block-num {
    background: var(--accent); color: var(--on-accent); border-radius: 8px;
    font: 700 .78rem/1 "Unbounded", sans-serif; padding: 7px 9px; white-space: nowrap;
  }
  .block-head h2 { flex: 1; min-width: 180px; }
  .chip { font-size: .75rem; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip.done { background: var(--gold-soft); color: var(--text); }

  .lead { font-family: "Unbounded", sans-serif; font-weight: 600; font-size: 1.05rem; margin-bottom: 8px; }
  .note { color: var(--muted); font-style: italic; }
  .sub { color: var(--muted); font-size: .92rem; margin-bottom: 12px; }
  .sect { margin-top: 18px; }
  .sect > h3 { margin-bottom: 10px; }

  .checks { columns: 2; column-gap: 24px; }
  .checks li { position: relative; padding-left: 28px; margin-bottom: 9px; break-inside: avoid; }
  .checks li::before {
    content: ""; position: absolute; left: 2px; top: .3em; width: 14px; height: 8px;
    border-left: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent); transform: rotate(-45deg);
  }
  .checks em { display: block; color: var(--muted); font-size: .86rem; }

  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .steps li {
    background: var(--accent); color: var(--on-accent); border-radius: 10px; padding: 10px 12px;
    display: flex; gap: 10px; align-items: center; font-weight: 500; font-size: .92rem;
  }
  .steps li b { font: 700 1.1rem/1 "Unbounded", sans-serif; }

  .attitude { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .attitude div { background: var(--accent-soft); border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .attitude i { font: 700 2rem/1 "Unbounded", sans-serif; color: var(--accent-strong); font-style: normal; }

  .types { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .type { border: 2px solid var(--accent); border-radius: 18px; padding: 14px; }
  .type h3 { color: var(--accent-strong); margin-bottom: 6px; font-size: .88rem; }
  .type p { color: var(--muted); font-size: .86rem; }
  .type .tip { color: var(--text); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }

  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .two .checks { columns: 1; }
  .golden li { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .golden span { flex: 1; background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 9px 12px; font-weight: 600; font-size: .9rem; text-align: center; }
  .golden b { color: var(--gold); font: 700 1.5rem/1 "Unbounded", sans-serif; }

  .quote { background: var(--quote-bg); color: var(--quote-text); border-radius: 14px; padding: 18px 20px; display: grid; grid-template-columns: auto 1fr; gap: 14px; margin-top: 18px; }
  .quote .mark { font: 700 2rem/1 "Unbounded", sans-serif; }
  .quote blockquote { margin: 0; font-weight: 600; }
  .quote cite { display: block; margin-top: 8px; font-size: .8rem; font-style: italic; opacity: .85; }

  /* ---------- Tasks ---------- */
  .task { margin-top: 20px; border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; background: var(--surface-2); }
  .task.done { border-color: var(--accent); }
  .task-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .task-head .ico { font-size: 1.2rem; line-height: 1.3; }
  .task-head h3 { flex: 1; font-size: .92rem; }
  .pts { font: 700 .72rem/1 "Unbounded", sans-serif; color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 5px 8px; white-space: nowrap; }
  .task.done .pts { background: var(--accent); color: var(--on-accent); }
  .task p.prompt { margin-bottom: 12px; font-size: .93rem; }

  .fields { display: grid; gap: 10px; }
  .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea, .custom-q {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px;
    background: var(--surface); color: var(--text); font: inherit; font-size: .93rem;
  }
  .field textarea { min-height: 96px; resize: vertical; }
  .field input:focus, .field textarea:focus, .custom-q:focus { outline: none; border-color: var(--accent); }
  .field.ok input, .field.ok textarea { border-color: var(--accent); }

  .ex-btn {
    margin-top: 12px; border: 1.5px dashed var(--gold); background: transparent; color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: .84rem; font-weight: 600; cursor: pointer;
  }
  .ex-btn[aria-expanded="true"] { background: var(--gold-soft); border-style: solid; }
  .examples { margin-top: 10px; background: var(--gold-soft); border-radius: 10px; padding: 12px 14px; font-size: .9rem; }
  .examples li { padding: 4px 0 4px 22px; position: relative; }
  .examples li::before { content: "💬"; position: absolute; left: 0; font-size: .8rem; top: 6px; }
  .examples li + li { border-top: 1px dashed color-mix(in srgb, var(--gold) 40%, transparent); }

  .q-item { padding: 12px 0; border-top: 1px dashed var(--line); }
  .q-item:first-of-type { border-top: 0; padding-top: 0; }
  .q-text { font-weight: 600; font-size: .93rem; margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; transition: .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .opt.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); animation: shake .35s; }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.ok) { opacity: .45; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .q-note { margin-top: 8px; font-size: .86rem; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
  .q-note.bad { background: var(--bad-soft); }

  .order-pool, .order-seq { display: flex; flex-direction: column; gap: 6px; }
  .order-seq { margin-bottom: 12px; min-height: 20px; }
  .order-seq .slot {
    display: flex; gap: 10px; align-items: center; background: var(--accent); color: var(--on-accent);
    border-radius: 10px; padding: 8px 12px; font-weight: 500; font-size: .9rem;
  }
  .order-seq .slot b { font: 700 .9rem/1 "Unbounded", sans-serif; }
  .order-seq.wrong .slot { background: var(--bad); }
  .order-pool button {
    text-align: left; border: 1.5px dashed var(--accent); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font-size: .9rem; cursor: pointer;
  }
  .order-pool button:hover { background: var(--accent-soft); }
  .order-msg { font-size: .86rem; margin-top: 8px; }

  .skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .skill { border-top: 2px solid var(--accent); padding-top: 12px; }
  .skill label { display: flex; gap: 8px; cursor: pointer; align-items: flex-start; }
  .skill .num { background: var(--accent); color: var(--on-accent); font: 700 .78rem/1 "Unbounded", sans-serif; padding: 5px 7px; border-radius: 6px; }
  .skill .txt { flex: 1; font-size: .9rem; }
  .skill input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
  .skill input:checked ~ .txt { color: var(--accent-strong); font-weight: 600; }
  .skill .say { margin-top: 6px; font-size: .82rem; color: var(--muted); font-style: italic; }

  .mood-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .mood-row button {
    border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.6rem;
    padding: 6px 10px; border-radius: 12px; transition: .15s; display: flex; flex-direction: column; align-items: center; color: var(--text);
  }
  .mood-row button small { font-size: .68rem; color: var(--muted); }
  .mood-row button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.06); }

  .q-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .q-picker button { border: 1.5px solid var(--accent); background: transparent; color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: .86rem; font-weight: 500; cursor: pointer; }
  .q-picker button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .q-picker button i { font-style: normal; font-size: .72rem; opacity: .8; margin-left: 4px; }
  .custom-q { margin-bottom: 12px; }
  .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); grid-auto-flow: column; gap: 10px 24px; }
  .answers label { display: flex; align-items: center; gap: 10px; }
  .answers .n { flex: none; width: 22px; height: 22px; border-radius: 5px; background: var(--line); color: var(--muted); font: 700 .72rem/22px "Unbounded", sans-serif; text-align: center; }
  .answers label.ok .n { background: var(--accent); color: var(--on-accent); }
  .answers input { flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid var(--line); background: transparent; color: var(--text); font: inherit; padding: 4px 2px; }
  .answers input:focus { outline: none; border-bottom-color: var(--accent); }

  /* ---------- Lock ---------- */
  .lock { text-align: center; border: 2px dashed var(--line); background: transparent; box-shadow: none; }
  .lock .big { font-size: 2.4rem; }
  .lock h2 { margin: 6px 0 6px; }
  .lock p { color: var(--muted); font-size: .92rem; }
  .live { display: inline-flex; gap: 8px; align-items: center; margin-top: 12px; font-size: .84rem; font-weight: 600; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .live.on i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent; } }
  .code-form { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .code-form input {
    width: 130px; text-align: center; font: 700 1.1rem "Unbounded", sans-serif; letter-spacing: .2em;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 8px; background: var(--surface); color: var(--text);
  }
  .code-msg { min-height: 1.3em; margin-top: 8px; font-size: .84rem; }
  .ahead { text-align: center; color: var(--muted); font-size: .86rem; margin-top: -6px; }

  .btn { border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: .88rem; background: var(--accent); color: var(--on-accent); }
  .btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- Host ---------- */
  .host { border: 2px solid var(--gold); }
  .host-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--line); }
  .host-row .code { font: 700 1rem "Unbounded", sans-serif; letter-spacing: .12em; background: var(--gold-soft); border-radius: 8px; padding: 4px 8px; }
  .host-row.open .state { color: var(--accent-strong); }
  .host-row .state { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .host-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .host-link { font-size: .84rem; word-break: break-all; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }

  /* ---------- Finish & toast ---------- */
  .finish { text-align: center; background: linear-gradient(135deg, var(--accent-soft), var(--gold-soft)); }
  .finish .big { font-size: 3rem; }
  .finish h2 { margin: 8px 0; }
  .toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 420px; }
  .toast {
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: .9rem;
    box-shadow: var(--shadow); animation: toast 3.2s ease forwards; text-align: center; pointer-events: auto;
  }
  .toast button { margin-left: 8px; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 3px 8px; font-weight: 600; cursor: pointer; }
  .toast.long { animation-duration: 6s; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(10px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 28px; }

  @media (max-width: 720px) {
    .scorebar-in { grid-template-columns: auto 1fr; }
    .badges { grid-column: 1 / -1; justify-content: space-between; }
    .steps, .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .attitude, .two, .answers { grid-template-columns: 1fr; }
    .answers { grid-template-rows: none; grid-auto-flow: row; }
    .checks { columns: 1; }
    .card { padding: 18px; }
    .task { padding: 14px; }
    .host-row { grid-template-columns: auto 1fr auto; }
    .host-row .btn { grid-column: 1 / -1; }
  }
  @media (max-width: 420px) { .steps, .skills { grid-template-columns: 1fr; } }
  @media print {
    body { background: #fff; }
    .scorebar, .theme-toggle, .toasts, .lock, .ex-btn, .host { display: none; }
    .card { box-shadow: none; border: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div class="scorebar">
  <div class="scorebar-in">
    <div class="score" aria-live="polite"><span id="score">0</span><small>⭐ балів</small></div>
    <div>
      <div class="level"><span id="levelName">Новачок 🌱</span><span id="levelNext"></span></div>
      <div class="lvbar"><i id="levelBar"></i></div>
    </div>
    <div class="badges" id="badges" aria-label="Значки за блоки"></div>
  </div>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="Змінити тему">◐</button>
<div class="toasts" id="toasts" aria-live="polite"></div>

<main class="wrap">
  <header class="hero">
    <div class="badge"><b>04</b><span>заняття</span></div>
    <div>
      <div class="eyebrow">Публічні виступи</div>
      <h1>Робота із запитаннями</h1>
    </div>
  </header>
  <div id="hostPanel"></div>
  <div id="blocks"></div>
  <footer>Публічні виступи · Заняття 4 · Робота із запитаннями</footer>
</main>

<script>
(function () {
  'use strict';

  /* ================= Налаштування доступу =================
     Блоки відкриває ведучий. Коди й пароль тут не зберігаються,
     лише їхні SHA-256 хеші. */
  var CFG = {
    hostHash: '70c097d3f156088ebbcbb5a1e3c4976fa5523edb5e5e10f3a52fc17ede154296',

      if (!silent) {
        var first = BLOCKS[prev + 1];
        var label = state.unlocked > prev + 1 ? 'блоки ' + first.n + '–' + state.unlocked : first.icon + ' ' + first.title;
        toast('🔓 Відкрито: ' + label, { label: 'Перейти', fn: function () { document.getElementById('block-' + first.n).scrollIntoView(); } }, true);
      }
    }
    drawHost();
  }

  function tryCode(code) {
    var msg = $('#codeMsg');
    if (!/^\d{4}$/.test(code)) { msg.textContent = 'Код — це 4 цифри.'; return; }
    var checks = Object.keys(CFG.codeHashes).map(function (n) {
      return sha('spe-zap-code:' + n + ':' + code).then(function (h) { return h === CFG.codeHashes[n] ? +n : 0; });
    });
    Promise.all(checks).then(function (r) {
      var n = Math.max.apply(null, r);
      if (!n) { msg.textContent = '✘ Невірний код. Перепитай у ведучого.'; return; }
      if (n <= state.unlocked) { msg.textContent = 'Цей блок уже відкрито.'; return; }
      state.manualAt = Date.now() / 1000;
      setUnlocked(n);
    });
  }

  /* ================= Зв'язок із ведучим (ntfy.sh) ================= */
  var queue = Promise.resolve();
  function handleMessage(text, time) {
    var m;
    if ((m = /^unlock:(\d+):(\d{4})$/.exec(text))) {
      var n = +m[1], code = m[2];
      if (!CFG.codeHashes[n]) return Promise.resolve();
      return sha('spe-zap-code:' + n + ':' + code).then(function (h) {
        if (h !== CFG.codeHashes[n] || time < state.lockedAt) return;
        setUnlocked(n, time < loadedAt);
      });
    }
    if ((m = /^lock:([0-9a-f]{16})$/.exec(text))) {
      return sha('spe-zap-lock:' + m[1]).then(function (h) {
        if (h !== CFG.lockHash || time <= state.lockedAt) return;
        state.lockedAt = time;
        if (time > state.manualAt && state.unlocked > 0) {
          state.unlocked = 0; save();
          if (!host.on) { renderBlocks(); if (time >= loadedAt) toast('🔒 Ведучий закрив блоки'); }
        } else save();
        drawHost();
      });
    }
    return Promise.resolve();
  }
  var loadedAt = Date.now() / 1000 - 5;
  function connect() {
    if (!('EventSource' in window)) return;
    var es = new EventSource(CFG.relay + topic + '/sse?since=all');
    es.onopen = function () { live = true; drawLive(); drawHost(); };
    es.onerror = function () { live = false; drawLive(); drawHost(); };
    es.onmessage = function (e) {
      try {
        var d = JSON.parse(e.data);
        if (d.event && d.event !== 'message') return;
        queue = queue.then(function () { return handleMessage(String(d.message || '').trim(), d.time || Date.now() / 1000); }).catch(function () {});
      } catch (err) {}
    };
  }
  function publish(text) {
    return fetch(CFG.relay + topic, { method: 'POST', body: text }).then(function (r) { if (!r.ok) throw new Error(r.status); });
  }

  /* ================= Панель ведучого (#host) ================= */
  function drawHost() {
    var panel = $('#hostPanel');
    if (location.hash !== '#host') { panel.innerHTML = ''; return; }
    if (!host.on) {
      if ($('#hostForm')) return;
      panel.innerHTML =
        '<section class="card host"><div class="block-head"><span class="block-num">Ведучий</span><h2>🎛️ Панель ведучого</h2></div>' +
        '<form class="code-form" id="hostForm" style="justify-content:flex-start"><input id="hostPw" type="password" placeholder="пароль" style="width:200px;letter-spacing:normal" autocomplete="current-password"><button class="btn" type="submit">Увійти</button></form>' +
        '<div class="code-msg" id="hostMsg"></div></section>';
      $('#hostForm').onsubmit = function (e) { e.preventDefault(); hostLogin($('#hostPw').value); };
      return;
    }
    var link = location.origin + location.pathname + (group ? '?g=' + group : '');
    var rows = BLOCKS.slice(1).map(function (b) {
      var open = state.unlocked >= b.n;
      return '<div class="host-row' + (open ? ' open' : '') + '"><span class="block-num">Блок ' + b.n + '</span><span>' + b.icon + ' ' + b.title + '</span>' +
        '<span><span class="code">' + host.codes[b.n] + '</span> <span class="state">' + (open ? '✔ відкрито' : 'закрито') + '</span></span>' +
        '<button class="btn" type="button" data-open="' + b.n + '"' + (open ? ' disabled' : '') + '>Відкрити для всіх</button></div>';
    }).join('');
    panel.innerHTML =
      '<section class="card host"><div class="block-head"><span class="block-num">Ведучий</span><h2>🎛️ Панель ведучого</h2>' +
      '<span class="chip">' + (live ? '🟢 зв’язок є' : '⚪ немає зв’язку — диктуй коди') + '</span></div>' +
      '<p class="sub">Натисни «Відкрити для всіх» — блок з’явиться в учасників за секунду. Якщо в когось немає зв’язку, назви код блоку: він відкриває цей блок і всі попередні. Ти бачиш усі блоки нижче для попереднього перегляду.</p>' +
      rows +
      '<div class="host-tools"><button class="btn danger" type="button" id="lockAll">Закрити все для всіх</button>' +
      '<button class="btn ghost" type="button" id="hostOut">Вийти</button><span class="code-msg" id="hostMsg"></span></div>' +
      '<div class="host-link">Посилання для учасників: <b>' + link + '</b></div></section>';
    panel.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function () {
        var n = +b.dataset.open;
        b.disabled = true;
        publish('unlock:' + n + ':' + host.codes[n])
          .then(function () { setUnlocked(n, true); $('#hostMsg').textContent = '✔ Блок ' + n + ' відкрито для всіх'; })
          .catch(function () { b.disabled = false; $('#hostMsg').textContent = '✘ Не вдалося надіслати. Продиктуй код ' + host.codes[n] + ' учасникам.'; });
      };
    });
    var lockBtn = $('#lockAll'), armed = false;
    lockBtn.onclick = function () {
      if (!armed) { armed = true; lockBtn.textContent = 'Точно закрити? Натисни ще раз'; setTimeout(function () { armed = false; if (lockBtn.isConnected) lockBtn.textContent = 'Закрити все для всіх'; }, 4000); return; }
      lockBtn.disabled = true;
      publish('lock:' + host.lockToken)
        .then(function () {
          $('#hostMsg').textContent = '✔ Усі блоки закрито для нової групи';
          lockBtn.textContent = 'Закрити все для всіх'; armed = false;
          setTimeout(function () { lockBtn.disabled = false; }, 2000);
        })
        .catch(function () { lockBtn.disabled = false; $('#hostMsg').textContent = '✘ Не вдалося надіслати'; });
    };
    $('#hostOut').onclick = function () { try { sessionStorage.removeItem('spe-zap-host'); } catch (e) {} host.on = false; panel.innerHTML = ''; drawHost(); renderBlocks(); };
  }

  function hostLogin(pw) {
    return sha('spe-zap-host:' + pw).then(function (h) {
      if (h !== CFG.hostHash) { var m = $('#hostMsg'); if (m) m.textContent = '✘ Невірний пароль'; return; }
      var jobs = Object.keys(CFG.codeHashes).map(function (n) {
        return sha(pw + ':block:' + n).then(function (x) { host.codes[n] = String(parseInt(x.slice(0, 8), 16) % 10000).padStart(4, '0'); });
      });
      jobs.push(sha(pw + ':lock').then(function (x) { host.lockToken = x.slice(0, 16); }));
      return Promise.all(jobs).then(function () {
        host.on = true;
        try { sessionStorage.setItem('spe-zap-host', pw); } catch (e) {}
        $('#hostPanel').innerHTML = '';
        drawHost(); renderBlocks();
      });
    });
  }
  window.addEventListener('hashchange', function () { drawHost(); });

  /* ================= Тема ================= */
  var root = document.documentElement;
  try { var th = localStorage.getItem('spe-theme'); if (th) root.dataset.theme = th; } catch (e) {}
  $('#themeToggle').onclick = function () {
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('spe-theme', root.dataset.theme); } catch (e) {}
  };

  /* ================= Старт ================= */
  renderBlocks();
  drawHost();
  var savedPw = null;
  try { savedPw = sessionStorage.getItem('spe-zap-host'); } catch (e) {}
  if (savedPw && location.hash === '#host') hostLogin(savedPw);
  connect();
})();
</script>
</body>
</html>
